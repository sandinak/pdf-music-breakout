name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A push that supersedes another does not need both to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the point of this matrix: the tool had never been run
        # there, and the failures it would produce -- reserved filenames,
        # locale text encodings, loopback sockets -- are all silent ones.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # One platform reads scanned pages for real; elsewhere that test skips.
      - name: Install Tesseract
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  ports-agree:
    name: the app and the CLI agree
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Tesseract so the scanned sample is compared too: Vision in the app
      # against Tesseract in the CLI.
      - name: Install Tesseract
        run: brew install tesseract
      - name: Split a generated book with both implementations
        run: make app-check
