<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8862"/>
      <stop offset="1" stop-color="#245840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="196" fill="url(#bg)"/>

  <!-- one book, coming apart into parts -->
  <g filter="url(#shadow)">
    <g transform="rotate(-9 512 540)">
      <rect x="214" y="228" width="404" height="536" rx="20" fill="#e9ece8"/>
    </g>
    <g transform="rotate(-3 512 540)">
      <rect x="272" y="212" width="404" height="552" rx="20" fill="#f5f7f3"/>
    </g>
    <g transform="rotate(5 512 540)">
      <rect x="330" y="196" width="412" height="568" rx="22" fill="#ffffff"/>
      <g fill="none" stroke="#2a2a28" stroke-width="9" stroke-linecap="round">
        <path d="M382 300h308M382 334h308M382 368h308M382 402h308M382 436h308"/>
      </g>
      <!-- a quaver sitting on the staff -->
      <g fill="#1a1a19">
        <ellipse cx="470" cy="600" rx="62" ry="47" transform="rotate(-20 470 600)"/>
        <rect x="518" y="420" width="18" height="176" rx="9"/>
        <path d="M534 424C616 462 648 512 628 576C638 506 600 470 534 486Z"/>
      </g>
    </g>
  </g>
</svg>
